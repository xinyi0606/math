   <g id="text_1">
    <text style="font-size: 9px; font-family: 'SimHei', 'DejaVu Sans'; fill: #1f2933" transform="translate(41.922166 64.351417)">历史实测负荷与光伏</text>
    <text style="font-size: 9px; font-family: 'SimHei', 'DejaVu Sans'; fill: #1f2933" transform="translate(48.672166 74.251417)">净负荷 N＝L－PV</text>
    <text style="font-size: 9px; font-family: 'SimHei', 'DejaVu Sans'; fill: #1f2933" transform="translate(32.922166 84.109229)">仅使用目标日之前的数据</text>
   </g>
   <g id="text_2">
